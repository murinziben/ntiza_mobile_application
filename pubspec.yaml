name: ntiza
description: NTIZA — discover and book agricultural equipment in Rwanda.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter_riverpod: ^2.5.0
  go_router: ">=14.0.0"
  google_fonts: ">=6.0.0"
  shared_preferences: ^2.3.0
  flutter_svg: ^2.5.0
  http: ^1.2.0
  image_picker: ^1.1.2
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
